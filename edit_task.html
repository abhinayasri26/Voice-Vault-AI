<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task | Voice Vault AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<nav class="navbar">

    <div class="logo">
        🎙️ Voice Vault AI
    </div>

    <div class="nav-right">

        <a href="{{ url_for('tasks') }}"
           class="back-btn">
            To-Do List
        </a>

    </div>

</nav>


<div class="tasks-container">

    <div class="task-form-box">

        <h1>
            ✏️ Edit Task
        </h1>


        <form
            method="POST"
            action="{{ url_for('edit_task', task_id=task.id) }}">

            <label>
                Task Name
            </label>

            <input
                type="text"
                name="task"
                value="{{ task.task }}"
                required
            >


            <div class="task-row">

                <div>

                    <label>
                        📅 Due Date
                    </label>

                    <input
                        type="date"
                        name="due_date"
                        value="{{ task.due_date }}"
                    >

                </div>


                <div>

                    <label>
                        ⏰ Due Time
                    </label>

                    <input
                        type="time"
                        name="due_time"
                        value="{{ task.due_time }}"
                    >

                </div>

            </div>


            <label>
                ⚡ Priority
            </label>

            <select name="priority">

                <option
                    value="High"
                    {% if task.priority == "High" %}selected{% endif %}>
                    High
                </option>

                <option
                    value="Medium"
                    {% if task.priority == "Medium" %}selected{% endif %}>
                    Medium
                </option>

                <option
                    value="Low"
                    {% if task.priority == "Low" %}selected{% endif %}>
                    Low
                </option>

            </select>


            <label class="checkbox-label">

                <input
                    type="checkbox"
                    name="reminder"
                    {% if task.reminder %}checked{% endif %}
                >

                🔔 Enable Reminder

            </label>


            <button
                type="submit"
                class="add-task-btn">

                Save Changes

            </button>

        </form>

    </div>

</div>

</body>

</html>
