<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voice Vault AI - Register</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body class="auth-body">


    <div class="auth-container">


        <div class="auth-box">


            <div class="auth-icon">
                🎙️
            </div>


            <h1>
                Create Account
            </h1>


            <p>
                Join Voice Vault AI today
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                method="POST"
                action="{{ url_for('register') }}">


                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >


                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >


                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >


                <button
                    type="submit"
                    class="auth-btn">

                    ✨ Create Account

                </button>


            </form>


            <div class="auth-link">

                <p>
                    Already have an account?
                </p>

                <a href="{{ url_for('login') }}">
                    Login Here
                </a>

            </div>


        </div>


    </div>


</body>

</html>
